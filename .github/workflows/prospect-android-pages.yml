name: Deploy Prospect Android Web App to Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/200-prospect-sales-engine/webapp/**'
      - '.github/workflows/prospect-android-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prospect-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload prospect web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/200-prospect-sales-engine/webapp
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
