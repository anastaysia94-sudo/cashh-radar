name: Export P500 Research Bundle

on:
  push:
    branches:
      - extract-p500-research-20260913
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode packed source-backed prospect bundle
        run: |
          python - <<'PY'
          import base64
          import csv
          import gzip
          import json
          import re
          from pathlib import Path

          data_dir = Path('prospect-android-app/data')
          chunks = []
          for number in range(1, 5):
              text = (data_dir / f'p500-gz-{number}.js').read_text(encoding='utf-8')
              match = re.search(r"\+'([^']*)';?\s*$", text)
              if not match:
                  raise RuntimeError(f'Could not decode chunk {number}')
              chunks.append(match.group(1))
          payload = json.loads(gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8'))
          fields = payload['fields']
          rows = [dict(zip(fields, row)) for row in payload['rows']]
          assert len(rows) == 500
          out = Path('research-export')
          out.mkdir()
          (out / 'p500-source-backed.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          with (out / 'p500-source-backed.csv').open('w', newline='', encoding='utf-8-sig') as fh:
              writer = csv.DictWriter(fh, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          (out / 'field-map.json').write_text(json.dumps({
              'id':'prospect_id','r':'priority_rank','b':'business','c':'city','i':'industry','e':'public_email','w':'website','u':'source_url','s':'service_focus','g':'public_signal','h':'hit_score','v':'deliverability_score','t':'verification_tier','d':'source_verified_at','q':'wave'
          }, indent=2), encoding='utf-8')
          PY

      - name: Upload research export
        uses: actions/upload-artifact@v4
        with:
          name: p500-source-backed-research-export
          path: research-export/
          retention-days: 7
