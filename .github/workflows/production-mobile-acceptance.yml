name: Cashh Radar Production Mobile Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-mobile-acceptance.yml'

concurrency:
  group: cashh-production-mobile-acceptance
  cancel-in-progress: true

jobs:
  production-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CASHH_BASE_URL: https://cashh-radar-web-production.up.railway.app

    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify live health and mobile PWA
        shell: bash
        run: |
          cat > cashh-production-acceptance.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const base = process.env.CASHH_BASE_URL.replace(/\/$/, '');

          async function mustResponse(path) {
            const r = await fetch(base + path, { redirect: 'follow', signal: AbortSignal.timeout(15000) });
            if (!r.ok) throw new Error(`${path} returned HTTP ${r.status}`);
            return r;
          }

          async function mustJson(path) {
            return await (await mustResponse(path)).json();
          }

          async function acceptance() {
            const health = await mustJson('/api/health');
            const ready = await mustJson('/api/health/ready');
            if (health.status !== 'ok') throw new Error(`/api/health did not report status=ok (got ${health.status})`);
            if (ready.status !== 'ready') throw new Error(`/api/health/ready did not report status=ready (got ${ready.status})`);

            await Promise.all([
              mustResponse('/prospects/manifest.webmanifest'),
              mustResponse('/prospects/sw.js')
            ]);

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const response = await page.goto(base + '/prospects/', { waitUntil: 'domcontentloaded', timeout: 20000 });
            if (!response || !response.ok()) throw new Error(`/prospects/ returned HTTP ${response && response.status()}`);
            await page.waitForSelector('body', { timeout: 5000 });

            const mobile = await page.evaluate(() => {
              const manifest = document.querySelector('link[rel="manifest"]')?.getAttribute('href') || null;
              const viewport = document.querySelector('meta[name="viewport"]')?.getAttribute('content') || null;
              const overflow = document.documentElement.scrollWidth - window.innerWidth;
              return {
                title: document.title,
                manifest,
                viewport,
                overflow,
                width: window.innerWidth,
                height: window.innerHeight
              };
            });

            if (!mobile.viewport || !mobile.viewport.includes('width=device-width')) {
              throw new Error('mobile viewport meta tag missing');
            }
            if (mobile.overflow > 1) {
              throw new Error(`horizontal overflow detected: ${mobile.overflow}px`);
            }
            if (!mobile.manifest) {
              throw new Error('manifest link missing');
            }
            await page.screenshot({ path: 'cashh-production-mobile.png', fullPage: false });
            fs.writeFileSync('cashh-production-mobile.json', JSON.stringify({ health, ready, mobile }, null, 2));
            console.log(JSON.stringify({ health: health.status, ready: ready.status, mobile }, null, 2));
            await browser.close();
          }

          Promise.race([
            acceptance(),
            new Promise((_, reject) => setTimeout(() => reject(new Error('overall_mobile_acceptance_timeout_90s')), 90000))
          ]).catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE
          node cashh-production-acceptance.cjs

      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashh-production-mobile-acceptance
          path: |
            cashh-production-mobile.png
            cashh-production-mobile.json
          if-no-files-found: warn
