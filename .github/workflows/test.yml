name: Cashh Radar Tests

on:
  push:
    paths-ignore:
      - 'prospect-portal/**'
      - 'dist-v5-v6/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'prospect-portal/**'
      - 'dist-v5-v6/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: cashh-radar-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python entrypoints
        run: python -m py_compile app.py cashh_loop.py cashh_loop_ui.py cashh_prospect_bridge.py cashh_performance_radar.py prospect_performance.py launcher.py api/index.py scripts/run_jobs.py scripts/preflight.py scripts/production_smoke.py

      - name: Remove generated prospect portal from test workspace
        run: rm -rf prospect-portal

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate deployment files and prospect PWA bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, re, yaml
          dockerfile=Path('Dockerfile').read_text(encoding='utf-8'); assert '0.0.0.0' in dockerfile and '${PORT:-8000}' in dockerfile and 'uvicorn launcher:app' in dockerfile
          for path in ('render.yaml','deploy/render.yaml'):
              data=yaml.safe_load(Path(path).read_text(encoding='utf-8')); assert isinstance(data,dict); services=data.get('services'); assert isinstance(services,list) and services; web=services[0]; assert web.get('type')=='web' and web.get('runtime')=='docker' and web.get('healthCheckPath')=='/api/health/ready'
          vercel=json.loads(Path('vercel.json').read_text(encoding='utf-8')); assert vercel['routes']==[{'src':'/(.*)','dest':'api/index.py'}] and 'api/index.py' in vercel.get('functions',{})
          railway=json.loads(Path('railway.json').read_text(encoding='utf-8')); assert railway['$schema']=='https://railway.com/railway.schema.json' and railway['build']['builder']=='DOCKERFILE' and railway['deploy']['healthcheckPath']=='/api/health/ready' and 'uvicorn launcher:app' in railway['deploy']['startCommand']
          launcher=Path('launcher.py').read_text(encoding='utf-8'); assert all(x in launcher for x in ('register_prospect_bridge(core_app)','register_performance_radar(core_app)','start_prospect_bridge_scheduler(core)','/api/prospects/performance','summarize_prospect_performance'))
          learned=Path('cashh_performance_radar.py').read_text(encoding='utf-8'); assert all(x in learned for x in ('MIN_SEGMENT_SENT = 3','FULL_WEIGHT_SENT = 10','MAX_SEGMENT_ADJUSTMENT = 10.0','/api/radar/performance-aware','prospect_performance','segment_learning'))
          app_dir=Path('prospect-android-app'); required=['index.html','easy.html','easy.css','easy-v3.css','easy-v4.css','easy-core.js','easy-v4-core.js','easy-v4-policy.js','easy-ui.js','easy-send.js','easy-v3.js','easy-v4-ui.js','easy-v4-image.js','prospect-bridge.js','server-performance.js','bootstrap-v4.js','pwa-runtime.js','prospects.js','sw.js','manifest.webmanifest','icon.svg','README.md','200_PROSPECT_SALES_ENGINE_LIVE_CRM_MASTER.xlsx','data/p500-gz-1.js','data/p500-gz-2.js','data/p500-gz-3.js','data/p500-gz-4.js','data/p500-loader.js']; missing=[x for x in required if not (app_dir/x).exists()]; assert not missing, f'Prospect PWA files missing: {missing}'
          index=(app_dir/'index.html').read_text(encoding='utf-8'); easy=(app_dir/'easy.html').read_text(encoding='utf-8'); sw=(app_dir/'sw.js').read_text(encoding='utf-8'); bootstrap=(app_dir/'bootstrap-v4.js').read_text(encoding='utf-8'); policy=(app_dir/'easy-v4-policy.js').read_text(encoding='utf-8'); bridge=(app_dir/'prospect-bridge.js').read_text(encoding='utf-8'); performance_ui=(app_dir/'server-performance.js').read_text(encoding='utf-8'); manifest=json.loads((app_dir/'manifest.webmanifest').read_text(encoding='utf-8'))
          for shell in (index,easy): assert all(x in shell for x in ('data/p500-loader.js','bootstrap-v4.js','easy-v4.css','pwa-runtime.js'))
          for asset in ('bootstrap-v4.js','easy-v4-core.js','easy-v4-policy.js','easy-v4-ui.js','easy-v4-image.js','prospect-bridge.js','server-performance.js','pwa-runtime.js','data/p500-loader.js'): assert asset in sw
          assert "url.pathname.startsWith('/api/')" in sw and 'cashh-radar-prospects-v7-truthful-timing-20260912' in sw
          assert all(x in bootstrap for x in ('easy-v4-policy.js','prospect-bridge.js','server-performance.js'))
          assert '/api/prospects/state/' in bridge and '/api/radar/unified' in bridge and 'TIMER_IDLE_MS=120000' in bridge and 'data-bridge="timer"' in bridge and 'Math.floor(workTimer.activeSeconds/60)' in bridge and '60000' not in bridge and 'Proposed $100 offers are not revenue.' in bridge
          assert all(x in performance_ui for x in ('/api/prospects/performance','/api/radar/performance-aware','Server-synced actual prospect performance','What your actual outreach is teaching Radar','Tiny samples do not get to run the company.'))
          assert 'reddit:false' in policy and 'emailOnly:true' in policy and manifest['name']=='Cashh Radar Prospect Engine' and manifest['start_url']=='./' and manifest['scope']=='./'
          chunks=[]
          for n in range(1,5):
              text=(app_dir/'data'/f'p500-gz-{n}.js').read_text(encoding='utf-8'); m=re.search(r"\+'([^']*)';?\s*$",text); assert m; chunks.append(m.group(1))
          payload=json.loads(gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8')); fields=payload.get('fields') or []; rows=payload.get('rows') or []; assert len(rows)==500; ei=fields.index('e'); emails=[str(r[ei] or '').strip().lower() for r in rows]; assert all(emails) and len(set(emails))==500
          PY

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/loop-ui.js
          node --check prospect-android-app/easy-core.js
          node --check prospect-android-app/easy-v4-core.js
          node --check prospect-android-app/easy-v4-policy.js
          node --check prospect-android-app/easy-ui.js
          node --check prospect-android-app/easy-send.js
          node --check prospect-android-app/easy-v3.js
          node --check prospect-android-app/easy-v4-ui.js
          node --check prospect-android-app/easy-v4-image.js
          node --check prospect-android-app/prospect-bridge.js
          node --check prospect-android-app/server-performance.js
          node --check prospect-android-app/bootstrap-v4.js
          node --check prospect-android-app/pwa-runtime.js
          node --check prospect-android-app/data/p500-loader.js
          node --check prospect-android-app/prospects.js

      - name: Check service worker JavaScript syntax
        run: |
          node --check static/sw.js
          node --check prospect-android-app/sw.js

      - name: Docker build smoke test
        run: docker build -t cashh-radar:ci .
