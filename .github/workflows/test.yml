name: Cashh Radar Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python entrypoints
        run: python -m py_compile app.py cashh_loop.py cashh_loop_ui.py cashh_prospect_bridge.py prospect_performance.py launcher.py api/index.py scripts/run_jobs.py scripts/preflight.py scripts/production_smoke.py

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate deployment files and prospect PWA bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import json
          import re
          import yaml

          dockerfile = Path('Dockerfile').read_text(encoding='utf-8')
          assert '0.0.0.0' in dockerfile, 'Dockerfile must bind to 0.0.0.0 for container platforms'
          assert '${PORT:-8000}' in dockerfile, 'Dockerfile must honor platform PORT'
          assert 'uvicorn launcher:app' in dockerfile, 'Dockerfile must expose the /prospects app mount'

          for path in ('render.yaml', 'deploy/render.yaml'):
              data = yaml.safe_load(Path(path).read_text(encoding='utf-8'))
              assert isinstance(data, dict), f'{path} must parse as a YAML object'
              services = data.get('services')
              assert isinstance(services, list) and services, f'{path} must define services'
              web = services[0]
              assert web.get('type') == 'web', f'{path} service type must be web'
              assert web.get('runtime') == 'docker', f'{path} runtime must be docker'
              assert web.get('healthCheckPath') == '/api/health/ready', f'{path} must use readiness health check'

          vercel = json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          assert vercel['routes'] == [{'src': '/(.*)', 'dest': 'api/index.py'}]
          assert 'api/index.py' in vercel.get('functions', {})

          railway = json.loads(Path('railway.json').read_text(encoding='utf-8'))
          assert railway['$schema'] == 'https://railway.com/railway.schema.json'
          assert railway['build']['builder'] == 'DOCKERFILE'
          assert railway['deploy']['healthcheckPath'] == '/api/health/ready'
          assert 'uvicorn launcher:app' in railway['deploy']['startCommand']

          launcher = Path('launcher.py').read_text(encoding='utf-8')
          assert 'register_prospect_bridge(core_app)' in launcher
          assert 'start_prospect_bridge_scheduler(core)' in launcher
          assert '/api/prospects/performance' in launcher
          assert 'summarize_prospect_performance' in launcher

          app_dir = Path('prospect-android-app')
          required = [
              'index.html', 'easy.html', 'easy.css', 'easy-v3.css', 'easy-v4.css',
              'easy-core.js', 'easy-v4-core.js', 'easy-v4-policy.js', 'easy-ui.js',
              'easy-send.js', 'easy-v3.js', 'easy-v4-ui.js', 'easy-v4-image.js',
              'prospect-bridge.js', 'server-performance.js', 'bootstrap-v4.js', 'pwa-runtime.js', 'prospects.js', 'sw.js',
              'manifest.webmanifest', 'icon.svg', 'README.md',
              '200_PROSPECT_SALES_ENGINE_LIVE_CRM_MASTER.xlsx',
              'data/p500-gz-1.js', 'data/p500-gz-2.js', 'data/p500-gz-3.js',
              'data/p500-gz-4.js', 'data/p500-loader.js',
          ]
          missing = [name for name in required if not (app_dir / name).exists()]
          assert not missing, f'Prospect PWA files missing: {missing}'

          index = (app_dir / 'index.html').read_text(encoding='utf-8')
          easy = (app_dir / 'easy.html').read_text(encoding='utf-8')
          sw = (app_dir / 'sw.js').read_text(encoding='utf-8')
          bootstrap = (app_dir / 'bootstrap-v4.js').read_text(encoding='utf-8')
          policy = (app_dir / 'easy-v4-policy.js').read_text(encoding='utf-8')
          bridge = (app_dir / 'prospect-bridge.js').read_text(encoding='utf-8')
          performance_ui = (app_dir / 'server-performance.js').read_text(encoding='utf-8')
          manifest = json.loads((app_dir / 'manifest.webmanifest').read_text(encoding='utf-8'))
          for shell_name, shell in (('index.html', index), ('easy.html', easy)):
              assert 'data/p500-loader.js' in shell, f'{shell_name} must load the 500-prospect integrity loader'
              assert 'bootstrap-v4.js' in shell, f'{shell_name} must boot the v4 prospect runtime'
              assert 'easy-v4.css' in shell, f'{shell_name} must load v4 styles'
              assert 'pwa-runtime.js' in shell, f'{shell_name} must register the install/update runtime'
          for asset in ('bootstrap-v4.js', 'easy-v4-core.js', 'easy-v4-policy.js', 'easy-v4-ui.js', 'easy-v4-image.js', 'prospect-bridge.js', 'server-performance.js', 'pwa-runtime.js', 'data/p500-loader.js'):
              assert asset in sw, f'service worker must cache {asset}'
          assert "url.pathname.startsWith('/api/')" in sw, 'service worker must bypass authenticated API caching'
          assert 'cashh-radar-prospects-v7-truthful-timing-20260912' in sw
          assert 'easy-v4-policy.js' in bootstrap, 'v4 bootstrap must enforce outreach policy before UI startup'
          assert 'prospect-bridge.js' in bootstrap, 'v4 bootstrap must load the unified server lifecycle bridge'
          assert 'server-performance.js' in bootstrap, 'v4 bootstrap must load persisted performance overlay'
          assert '/api/prospects/state/' in bridge and '/api/radar/unified' in bridge
          assert 'TIMER_IDLE_MS=120000' in bridge, 'work timer must pause after two minutes without activity'
          assert 'data-bridge="timer"' in bridge, 'prospect focus must expose explicit Start/Stop work timer control'
          assert 'Math.floor(workTimer.activeSeconds/60)' in bridge, 'partial timer minutes must never be rounded up'
          assert '60000' not in bridge, 'implicit one-minute focus-tab effort timer must not return'
          assert 'Proposed $100 offers are not revenue.' in bridge, 'actual performance must stay separate from modeled offer value'
          assert '/api/prospects/performance' in performance_ui
          assert 'Server-synced actual prospect performance' in performance_ui
          assert 'Proposed $100 offers are not counted as revenue.' in performance_ui
          assert 'reddit:false' in policy and 'emailOnly:true' in policy, 'email-only/no-Reddit policy flags must remain enabled'
          assert manifest['name'] == 'Cashh Radar Prospect Engine'
          assert manifest['start_url'] == './'
          assert manifest['scope'] == './'

          chunks = []
          for number in range(1, 5):
              text = (app_dir / 'data' / f'p500-gz-{number}.js').read_text(encoding='utf-8')
              match = re.search(r"\+'([^']*)';?\s*$", text)
              assert match, f'Could not parse compressed prospect chunk {number}'
              chunks.append(match.group(1))
          payload = json.loads(gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8'))
          fields = payload.get('fields') or []
          rows = payload.get('rows') or []
          assert len(rows) == 500, f'Expected 500 source-backed prospects, got {len(rows)}'
          email_index = fields.index('e')
          emails = [str(row[email_index] or '').strip().lower() for row in rows]
          assert all(emails), 'Every source-backed prospect must retain a public email in the packed dataset'
          assert len(set(emails)) == 500, 'Packed prospect emails must remain unique'
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/loop-ui.js
          node --check prospect-android-app/easy-core.js
          node --check prospect-android-app/easy-v4-core.js
          node --check prospect-android-app/easy-v4-policy.js
          node --check prospect-android-app/easy-ui.js
          node --check prospect-android-app/easy-send.js
          node --check prospect-android-app/easy-v3.js
          node --check prospect-android-app/easy-v4-ui.js
          node --check prospect-android-app/easy-v4-image.js
          node --check prospect-android-app/prospect-bridge.js
          node --check prospect-android-app/server-performance.js
          node --check prospect-android-app/bootstrap-v4.js
          node --check prospect-android-app/pwa-runtime.js
          node --check prospect-android-app/data/p500-loader.js
          node --check prospect-android-app/prospects.js

      - name: Check service worker JavaScript syntax
        run: |
          node --check static/sw.js
          node --check prospect-android-app/sw.js

      - name: Docker build smoke test
        run: docker build -t cashh-radar:ci .
