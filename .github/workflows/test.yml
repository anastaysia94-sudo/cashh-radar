name: Cashh Radar Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'prospect-portal/**'
      - 'dist-v5-v6/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'prospect-portal/**'
      - 'dist-v5-v6/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: cashh-radar-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Compile Python entrypoints
        run: |
          python -m py_compile \
            launcher.py \
            cashh_prospect_bridge.py \
            cashh_performance_radar.py \
            prospect_performance.py \
            cashh_loop.py \
            cashh_loop_ui.py \
            api/index.py

      - name: Remove generated prospect portal from test workspace
        run: rm -rf prospect-portal

      - name: Run Python tests
        run: pytest -q

      - name: Validate deployment files and canonical prospect PWA
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f render.yaml
          test -f deploy/render.yaml
          test -f vercel.json
          test -f railway.json
          test -f launcher.py
          test -f cashh_performance_radar.py
          test -d prospect-android-app
          test -f prospect-android-app/README.md

          grep -q '0.0.0.0' Dockerfile
          grep -q '\${PORT:-8000}' Dockerfile
          grep -q 'uvicorn launcher:app' Dockerfile
          grep -q '/api/health/ready' render.yaml
          grep -q '/api/health/ready' deploy/render.yaml
          grep -q 'api/index.py' vercel.json
          grep -q 'Dockerfile' railway.json
          grep -q '/api/health/ready' railway.json

          grep -q 'prospect' launcher.py
          grep -q 'performance' launcher.py
          grep -q 'scheduler' launcher.py
          grep -q 'threshold' cashh_performance_radar.py

          # The operator PWA is mounted from prospect-android-app/ at /prospects/.
          for f in prospect-android-app/index.html prospect-android-app/easy.html; do
            test -f "$f"
            grep -q 'data/p500-loader.js' "$f"
            grep -q 'bootstrap-v4.js' "$f"
            grep -q 'pwa-runtime.js' "$f"
            grep -q '700 prospects' "$f"
          done

          test -f prospect-android-app/sw.js
          grep -q 'cashh-radar-prospects-v7-truthful-timing-20260912' prospect-android-app/sw.js
          grep -q "startsWith('/api/')" prospect-android-app/sw.js
          grep -q 'data/p500-loader.js' prospect-android-app/sw.js
          grep -q 'easy-v4-policy.js' prospect-android-app/sw.js
          grep -q 'prospect-bridge.js' prospect-android-app/sw.js
          grep -q 'server-performance.js' prospect-android-app/sw.js

          test -f prospect-android-app/prospect-bridge.js
          grep -q 'state' prospect-android-app/prospect-bridge.js
          grep -q 'performance' prospect-android-app/prospect-bridge.js

          test -f prospect-android-app/server-performance.js
          grep -q 'server' prospect-android-app/server-performance.js
          grep -Eq 'actual performance|realized' prospect-android-app/server-performance.js
          grep -q 'not counted as revenue' prospect-android-app/server-performance.js

          test -f prospect-android-app/easy-v4-policy.js
          grep -q 'reddit:false' prospect-android-app/easy-v4-policy.js
          grep -q 'emailOnly:true' prospect-android-app/easy-v4-policy.js

          test -f prospect-android-app/bootstrap-v4.js
          grep -q 'PROSPECT_TARGET_TOTAL=700' prospect-android-app/bootstrap-v4.js
          grep -q 'easy-v4-policy.js' prospect-android-app/bootstrap-v4.js
          grep -q 'prospect-bridge.js' prospect-android-app/bootstrap-v4.js
          grep -q 'server-performance.js' prospect-android-app/bootstrap-v4.js

          for n in 1 2 3 4; do
            test -f "prospect-android-app/data/p500-gz-${n}.js"
          done
          test -f prospect-android-app/data/p500-loader.js

          # Transitional partial datasets are deliberately removed so the runtime has
          # one source of truth instead of multiple conflicting 500-lead files.
          test ! -e prospect-android-app/data/prospects-500-packed.js
          test ! -e prospect-android-app/data/prospects-500-01.js
          test ! -e prospect-android-app/data/prospects-500-02.js
          test ! -e prospect-android-app/data/prospects-500-03.js

          python - <<'PY'
          import base64
          import gzip
          import json
          import re
          from pathlib import Path

          for p in ['render.yaml','deploy/render.yaml','vercel.json','railway.json']:
              text = Path(p).read_text(encoding='utf-8')
              assert text.strip(), p
          json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          json.loads(Path('railway.json').read_text(encoding='utf-8'))

          manifest=json.loads(Path('prospect-android-app/manifest.webmanifest').read_text(encoding='utf-8'))
          for key in ('name','start_url','scope'):
              assert manifest.get(key), key
          assert manifest['name'] == 'Cashh Radar Prospect Engine'

          parts=[]
          for n in range(1,5):
              text=Path(f'prospect-android-app/data/p500-gz-{n}.js').read_text(encoding='utf-8')
              match=re.search(r"\+\s*'([^']+)'", text)
              assert match, f'packed dataset chunk {n} is malformed'
              parts.append(match.group(1))

          packed=''.join(parts)
          payload=json.loads(gzip.decompress(base64.b64decode(packed)).decode('utf-8'))
          fields=payload['fields']
          rows=payload['rows']
          email_i=fields.index('e')
          emails=[str(row[email_i]).strip().lower() for row in rows]
          assert len(rows)==500, len(rows)
          assert all(emails), 'empty public email found'
          assert len(set(emails))==500, 'public emails are not unique'
          print('canonical prospect PWA validation: 500 packed source-backed businesses + 700 queue target OK')
          PY

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find . -path './.git' -prune -o -path './node_modules' -prune -o -name '*.js' -type f -print0)

      - name: Check service worker JavaScript syntax
        run: node --check prospect-android-app/sw.js

      - name: Docker build smoke test
        run: docker build --pull -t cashh-radar-ci:smoke .
