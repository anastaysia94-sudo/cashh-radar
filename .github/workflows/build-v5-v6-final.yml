name: Build V5 V6 Ethical Prospect Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_v5_v6_assets.py'
      - 'data/v5-v6-research/**'
      - '.github/workflows/build-v5-v6-final.yml'

permissions:
  contents: write

jobs:
  build-v5-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pillow beautifulsoup4

      - name: Normalize final builder compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_v5_v6_assets.py')
          s=p.read_text()
          s=s.replace('if not k.startswith("_")','if k and not k.startswith("_")')
          old='''    for batch in (10,11):\n        rows.extend(parse_roster(RESEARCH/f"batch{batch}-2026-09-13.md", batch))\n'''
          new='''    # Final build uses only canonical accepted CSV snapshots.\n    # Batch 10 duplicated Batch 9 and was replaced by 15 unique Batch 24 records;\n    # Batch 11 already has its own canonical accepted CSV.\n'''
          if old not in s:
              raise RuntimeError('Expected builder compatibility target was not found; refusing a silent CI mutation')
          s=s.replace(old,new)
          s=s.replace('msg=EmailMessage(policy=SMTP)', 'msg=EmailMessage(policy=SMTP.clone(max_line_length=998))')
          p.write_text(s)
          print('final builder compatibility patch applied: canonical accepted CSV set + Unicode-safe EML subjects')
          PY

      - name: Build V5 and V6 assets
        run: python scripts/build_v5_v6_assets.py

      - name: Verify generated asset counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('dist-v5-v6/combined/QA-Report.json').read_text())
          assert qa['status']=='PASS', qa
          assert qa['records']==400 and qa['v5']==200 and qa['v6']==200, qa
          assert qa['unique_businesses']==400 and qa['unique_emails']==400, qa
          assert qa['graphics']==400 and qa['eml']==400, qa
          print(json.dumps(qa, indent=2))
          PY

      - name: Publish lightweight GitHub portals and datasets
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          targets = [
              ('V5', Path('prospect-portal/santa-clara-v5')),
              ('V6', Path('prospect-portal/santa-clara-v6')),
              ('combined', Path('prospect-portal/santa-clara-v5-v6')),
          ]

          for src_name, dst in targets:
              src = Path('dist-v5-v6') / src_name
              dst.mkdir(parents=True, exist_ok=True)
              if src_name == 'V5':
                  portal = src / 'Prospect-Portal-V5.html'
                  files = ['V5-200-Leads.csv','prospects-v5.json','Why-V5-Wins.csv','TOP-25-FIRST.txt','README.md']
              elif src_name == 'V6':
                  portal = src / 'Prospect-Portal-V6.html'
                  files = ['V6-200-Leads.csv','prospects-v6.json','Why-V6-Wins.csv','TOP-25-FIRST.txt','README.md']
              else:
                  portal = src / 'Prospect-Portal-V5-V6-Combined.html'
                  files = ['V5-V6-400-Leads.csv','prospects-v5-v6.json','RESEARCH-NOTES.md','QA-Report.json']

              html = portal.read_text(encoding='utf-8')
              html = html.replace(
                  '<img loading="lazy" src="graphics/${esc(r.GraphicFilename)}">',
                  '<div class="preview" style="display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;background:linear-gradient(135deg,#10283d,#153d38);font-size:18px;font-weight:800">PRIVATE PREVIEW • ${esc(r.Business)} • ${esc(r.ServiceFocus)}</div>'
              )
              html = html.replace(
                  '<a href="ready-emails/${esc(r.EMLFilename)}">Ready .eml</a>',
                  '<span class="pill">Full attached .eml is in the downloadable build artifact</span>'
              )
              (dst / 'index.html').write_text(html, encoding='utf-8')
              for f in files:
                  if (src / f).exists():
                      shutil.copy2(src / f, dst / f)

          Path('prospect-portal/README.md').write_text('''# Cashh Radar Prospect Portals\n\n- `santa-clara-v5/` — 200-lead ethical V5 experiment: show the work + clear value.\n- `santa-clara-v6/` — 200-lead ethical V6 experiment: show the work + choice/control.\n- `santa-clara-v5-v6/` — combined 400-lead operator portal and source datasets.\n\nThe repository portals are intentionally lightweight. The 400 full-resolution preview JPGs and attached `.eml` files remain in the downloadable build artifact / complete ZIP packages instead of bloating the repository.\n''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospect-portal/
          if ! git diff --cached --quiet; then
            git commit -m "Publish final V5/V6 lightweight prospect portals"
            git push
          else
            echo "No portal publication changes to commit."
          fi

      - name: Upload complete V5 V6 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashh-radar-v5-v6-assets
          path: dist-v5-v6/
          if-no-files-found: error
          retention-days: 30
