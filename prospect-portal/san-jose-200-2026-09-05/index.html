<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>San Jose 200 Prospect Portal</title><style>
:root{--bg:#07111d;--panel:#0d1d2d;--text:#edf5fb;--muted:#9fb2c5;--mint:#48dcc9;--gold:#ffd26f;--line:#244156}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0d2942 0,#07111d 36%,#040b12 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(7,17,29,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 18px}.top{max-width:1500px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 18px 0 0}.stat{background:#10263a;border:1px solid #1f4760;border-radius:999px;padding:7px 11px;font-size:13px;color:#cce5f4}.controls{max-width:1500px;margin:10px auto 0;display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:9px}input,select,textarea{background:#0a1927;color:var(--text);border:1px solid #24455f;border-radius:10px;padding:10px}button,.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer;background:#17364d;color:#fff}.pay{background:#ffd26f;color:#10202f}.email{background:#48dcc9;color:#07151f}.source{background:#1c3e59}.chat{background:#6d58d9}.ghost{background:#152838}main{max-width:1500px;margin:18px auto;padding:0 14px 80px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(18,38,58,.96),rgba(9,23,35,.96));border:1px solid #20445b;border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.22)}.preview{aspect-ratio:16/10;width:100%;padding:24px;background:radial-gradient(circle at 82% 15%,rgba(72,220,201,.30),transparent 28%),linear-gradient(135deg,#061522,#0b3148 58%,#123b3c);display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.preview:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 45%,rgba(255,210,111,.08));pointer-events:none}.pvtag{font-size:12px;letter-spacing:.13em;color:#7af2df;font-weight:800;margin-bottom:10px}.pvbiz{font-size:27px;line-height:1.02;font-weight:900;max-width:92%;text-shadow:0 3px 15px #000}.pvsvc{font-size:14px;color:#ffd26f;margin-top:10px;max-width:92%}.body{padding:14px}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.rank{color:var(--gold);font-weight:800}.score{background:#173c41;color:#7af2df;border-radius:999px;padding:4px 8px;font-weight:800}.signal{color:#c5d6e4;font-size:13px;margin:7px 0 10px}h2{font-size:18px;margin:8px 0 3px}.service{color:#8fc6e8;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.emailcopy{white-space:pre-wrap;background:#071722;border:1px solid #17394d;border-radius:12px;padding:11px;font-size:12.5px;color:#d8e8f1;max-height:210px;overflow:auto}details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}summary{cursor:pointer;color:#8fe9dc;font-weight:700}.reply{margin:9px 0;padding:9px;background:#091926;border-radius:9px;font-size:12.5px}.label{color:#ffd26f;font-weight:700}textarea{width:100%;min-height:64px;margin-top:7px}.footerline{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.small{font-size:12px;color:var(--muted)}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.grid{grid-template-columns:1fr}h1{width:100%}}</style></head><body><header><div class="top"><h1>San Jose — 200 High-Intent Prospect Portal</h1><span class="stat">200 additional leads</span><span class="stat">PayPal $100 ready</span><span class="stat">200 tailored previews</span><span class="stat" id="visibleCount">loading…</span></div><div class="controls"><input id="q" placeholder="Search business, service, email, signal…"><select id="industry"><option value="">All industries</option></select><select id="statusFilter"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Replied</option><option>Interested</option><option>Invoice Sent</option><option>Paid</option><option>Fulfilled</option><option>Follow-up</option><option>Lost</option><option>Do Not Contact</option></select><button class="ghost" id="nextNew">Next unsent</button><button class="ghost" id="reset">Reset</button></div></header><main><div class="small">Scores prioritize outreach; they are not guaranteed response probabilities. Send individually and verify each source before contact. Status and notes are saved in this browser.</div><div class="grid" id="grid"></div></main><script>
const INVOICE="https://www.paypal.com/invoice/p/#7T6DC9A6WFH3XXCT"; let P=[]; const grid=document.getElementById('grid'),q=document.getElementById('q'),ind=document.getElementById('industry'),sf=document.getElementById('statusFilter');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const state=id=>JSON.parse(localStorage.getItem('sj2:'+id)||'{}'); const save=(id,obj)=>localStorage.setItem('sj2:'+id,JSON.stringify({...state(id),...obj}));
function parseCSV(t){const a=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const x=t[i],n=t[i+1];if(x==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);if(r.some(v=>v!==''))a.push(r);r=[];c=''}else c+=x}if(c||r.length){r.push(c);a.push(r)}const h=a.shift().map(x=>x.replace(/^\uFEFF/,''));return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]??''])))}
function enrich(p){p.Rank=+p.Rank;p['Hit Score']=+p['Hit Score'];p.Subject=`I made this for ${p.Business}`;p.Initial=`Hi ${p.Business} team,\n\nI noticed ${p.Signal}, so I made the attached private concept specifically around your ${p.ServiceFocus} work.\n\nIf you like the direction, I can finish a complete $100 same-day package for ${p.Business}: 10 ready-to-post social/Google posts, stronger CTA copy, customer follow-up messages, professional review replies, and custom promotional graphics. No subscription or contract.\n\nWorth me finishing the full set?\n\nIf you’d rather start immediately, here’s the $100 PayPal invoice:\n${INVOICE}\n\nThanks,\nAnastaysia`;p.Mailto=`mailto:${p.Email}?subject=${encodeURIComponent(p.Subject)}&body=${encodeURIComponent(p.Initial)}`;p.Chat=`codex://new?prompt=${encodeURIComponent(`Prospect ${p.ID} — ${p.Business} in San Jose. Signal: ${p.Signal}. Offer: $100 one-time content package. PayPal invoice: ${INVOICE}. Help me manage this exact prospect conversation, draft replies, close payment, and fulfill the package.`)}`;return p}
function replies(p){return{yes:`Absolutely — I’ll build the full package around ${p.ServiceFocus}. The total is $100 one-time. If you haven’t already paid, here’s the PayPal invoice: ${INVOICE} Once payment is confirmed, I’ll start the custom package for ${p.Business}.`,price:`I understand. It’s $100 one-time — not monthly — and you keep the complete package: 10 posts, finished graphics, CTA copy, follow-up messages and review replies.`,proof:`Of course. The private preview was made specifically for ${p.Business} around ${p.ServiceFocus}. I can also send two additional sample post concepts before you decide.`,more:`Sure — the package is built specifically for ${p.Business}, not a template. I’ll use your ${p.ServiceFocus} focus and the public details already on your site to create ready-to-use content.`,later:`No problem at all. I’ll leave the concept with you. If the timing changes, reply here and I can pick it back up.`,follow:`Hi ${p.Business} team — quick follow-up on the private ${p.ServiceFocus} concept I sent. If you want me to finish the full $100 set, reply YES. If you’d rather start now, the PayPal invoice is ${INVOICE}. If it’s not a fit, no worries.`}}
function card(p){const st=state(p.ID),status=st.status||'New',R=replies(p);return `<article class="card"><div class="preview"><div class="pvtag">PRIVATE SAN JOSE CONCEPT</div><div class="pvbiz">${esc(p.Business)}</div><div class="pvsvc">${esc(p.ServiceFocus)} • ${esc(p.Signal)}</div></div><div class="body"><div class="meta"><span class="rank">#${p.Rank}</span><span class="score">Score ${p['Hit Score']}</span><span class="small">${esc(p['Forecast Reply Window'])}</span></div><h2>${esc(p.Business)}</h2><div class="service">${esc(p.Industry)} • ${esc(p.ServiceFocus)}</div><div class="signal">Why now: ${esc(p.Signal)}</div><div class="actions"><a class="btn email" href="${esc(p.Mailto)}">Email now</a><a class="btn pay" target="_blank" href="${INVOICE}">PayPal $100</a><a class="btn source" target="_blank" href="${esc(p.Website)}">Verify source</a><a class="btn chat" href="${esc(p.Chat)}">Prospect chat</a><button class="ghost" onclick='navigator.clipboard.writeText(${JSON.stringify(p.Initial)})'>Copy email</button></div><div class="emailcopy">${esc(p.Initial)}</div><details><summary>Reply branches</summary><div class="reply"><span class="label">Interested:</span> ${esc(R.yes)}</div><div class="reply"><span class="label">Price:</span> ${esc(R.price)}</div><div class="reply"><span class="label">Proof:</span> ${esc(R.proof)}</div><div class="reply"><span class="label">More info:</span> ${esc(R.more)}</div><div class="reply"><span class="label">Not now:</span> ${esc(R.later)}</div><div class="reply"><span class="label">Follow-up:</span> ${esc(R.follow)}</div></details><div class="footerline"><select onchange="save('${p.ID}',{status:this.value});render()">${['New','Contacted','Replied','Interested','Invoice Sent','Paid','Fulfilled','Follow-up','Lost','Do Not Contact'].map(x=>`<option ${x===status?'selected':''}>${x}</option>`).join('')}</select><input placeholder="Last contact" value="${esc(st.last||'')}" onchange="save('${p.ID}',{last:this.value})"></div><textarea placeholder="Notes" onchange="save('${p.ID}',{notes:this.value})">${esc(st.notes||'')}</textarea></div></article>`}
function render(){const n=q.value.trim().toLowerCase(),ii=ind.value,ss=sf.value;let ct=0;grid.innerHTML=P.filter(p=>{const st=state(p.ID).status||'New',s=(p.Business+' '+p.Industry+' '+p.Email+' '+p.Signal+' '+p.ServiceFocus).toLowerCase();return(!n||s.includes(n))&&(!ii||p.Industry===ii)&&(!ss||st===ss)}).map(p=>{ct++;return card(p)}).join('');document.getElementById('visibleCount').textContent=ct+' visible'}
Promise.all([1,2,3,4].map(i=>fetch(`prospects-${i}.csv`).then(r=>r.text()))).then(parts=>{P=parts.flatMap(parseCSV).map(enrich);[...new Set(P.map(x=>x.Industry))].sort().forEach(x=>{const o=document.createElement('option');o.value=o.textContent=x;ind.appendChild(o)});render()});q.oninput=render;ind.onchange=render;sf.onchange=render;document.getElementById('reset').onclick=()=>{q.value='';ind.value='';sf.value='';render()};document.getElementById('nextNew').onclick=()=>{const p=P.find(x=>(state(x.ID).status||'New')==='New');if(p){q.value=p.Business;render()}};
</script></body></html>
